<!DOCTYPE html>
<html lang="en">
<head><meta name="robots" content="noindex,nofollow">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>Nuée — mini shoot'em up</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap" rel="stylesheet">
<style>
  html,body{margin:0;height:100%;background:#050404;overflow:hidden;overscroll-behavior:none}
  body{display:flex;align-items:center;justify-content:center;touch-action:none;
    -webkit-user-select:none;user-select:none;-webkit-touch-callout:none;-webkit-tap-highlight-color:transparent}
  #wrap{position:relative;line-height:0}
  canvas{display:block;touch-action:none}
  .btns{position:absolute;top:8px;right:8px;display:flex;gap:6px}
  .btns button{width:34px;height:34px;border-radius:8px;border:1px solid rgba(255,216,138,.22);
    background:rgba(10,9,8,.55);color:#ffd88a;display:flex;align-items:center;justify-content:center;
    padding:0;cursor:pointer;touch-action:manipulation}
  .btns button svg{width:16px;height:16px;display:block}
  .btns button[hidden]{display:none}
  #wrap{--s:1}
  .px{font-family:"Press Start 2P",monospace;color:#ffd88a}
  #bEdit{position:absolute;left:50%;transform:translateX(-50%);bottom:calc(var(--s)*64px);
    font:calc(var(--s)*8px)/1.4 "Press Start 2P",monospace;color:#ffd88a;background:rgba(10,9,8,.6);
    border:1px solid rgba(255,216,138,.35);border-radius:calc(var(--s)*8px);padding:calc(var(--s)*10px) calc(var(--s)*14px);
    cursor:pointer;white-space:nowrap;touch-action:manipulation}
  #bEdit:hover{background:rgba(255,216,138,.12)}
  #bEdit[hidden],#ed[hidden]{display:none}
  #ed{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;
    gap:calc(var(--s)*16px);background:#0a0908;line-height:1.4;touch-action:none}
  #ed h2{margin:0;font:calc(var(--s)*12px)/1.4 "Press Start 2P",monospace;color:#ffd88a;text-shadow:0 0 10px rgba(255,216,138,.5)}
  #ed p{margin:0;font:calc(var(--s)*7px)/1.6 "Press Start 2P",monospace;color:rgba(242,230,201,.55);text-align:center}
  #prev{width:calc(var(--s)*72px);height:calc(var(--s)*63px)}
  #grid{display:grid;grid-template-columns:repeat(8,1fr);gap:calc(var(--s)*3px);width:calc(var(--s)*248px);touch-action:none}
  #grid i{display:block;aspect-ratio:1;border-radius:calc(var(--s)*3px);background:rgba(242,230,201,.07);cursor:pointer}
  #grid{--c:#f2e6c9}
  #grid i.on{background:var(--c);box-shadow:0 0 calc(var(--s)*6px) var(--c)}
  #tabs button{opacity:.5}
  #tabs button.cur{opacity:1;border-color:currentColor}
  #grid i.mid{box-shadow:inset 0 0 0 1px rgba(255,216,138,.1)}
  .row{display:flex;gap:calc(var(--s)*8px);flex-wrap:wrap;justify-content:center}
  #ed button{font:calc(var(--s)*7px)/1.4 "Press Start 2P",monospace;color:#f2e6c9;background:rgba(242,230,201,.06);
    border:1px solid rgba(242,230,201,.22);border-radius:calc(var(--s)*7px);padding:calc(var(--s)*9px) calc(var(--s)*10px);cursor:pointer;touch-action:manipulation}
  #ed button:hover{background:rgba(242,230,201,.12)}
  #ed button.on{color:#ffd88a;border-color:rgba(255,216,138,.55)}
  #ed button.go{color:#0a0908;background:#ffd88a;border-color:#ffd88a}
  #ed button:disabled{opacity:.35;cursor:default}
</style>
</head>
<body>
<div id="wrap">
  <canvas id="c"></canvas>
  <div class="btns">
    <button id="bPause" aria-label="Pause" hidden></button>
    <button id="bSound" aria-label="Son"></button>
  </div>
  <button id="bEdit">✎ DRAW YOUR INVADERS</button>
  <div id="ed" hidden>
    <h2>YOUR INVADERS</h2>
    <div class="row" id="tabs">
      <button data-k="A">30 PTS</button>
      <button data-k="B">20 PTS</button>
      <button data-k="C">10 PTS</button>
    </div>
    <canvas id="prev" width="216" height="189"></canvas>
    <div id="grid"></div>
    <p>Draw on the grid.<br>They walk on their own.</p>
    <div class="row">
      <button id="eSym" class="on">MIRROR</button>
      <button id="eClear">CLEAR</button>
      <button id="eReset">RESET</button>
    </div>
    <div class="row">
      <button id="eBack">BACK</button>
      <button id="eGo" class="go">PLAY WITH THEM ▸</button>
    </div>
  </div>
</div>
<script>
(() => {
'use strict';
const W = 360;
let H = 640;
const cv = document.getElementById('c');
const ctx = cv.getContext('2d');
const bPause = document.getElementById('bPause');
const bSound = document.getElementById('bSound');
const bEdit = document.getElementById('bEdit');
const FONT = '"Press Start 2P", monospace';

let state = 'title'; // title | edit | play | paused | clear | over
let scale = 1;

const store = {
  get(k){ try { return localStorage.getItem(k); } catch(e){ return null; } },
  set(k,v){ try { localStorage.setItem(k,v); } catch(e){} }
};
let best = parseInt(store.get('nuee-best') || '0', 10) || 0;
let muted = store.get('nuee-mute') === '1';
let newRecord = false;

const rand = (a,b) => a + Math.random()*(b-a);
const clamp = (v,a,b) => Math.max(a, Math.min(b, v));

/* ---------- Sprites (dessins originaux) ---------- */
const ART = {
  A: [[
    "...##...",
    "..#..#..",
    ".#.##.#.",
    "#.####.#",
    ".#.##.#.",
    "..#..#..",
    "...##..."
  ],[
    "#..##..#",
    "..#..#..",
    ".#.##.#.",
    "..####..",
    ".#.##.#.",
    "..#..#..",
    "#..##..#"
  ]],
  B: [[
    "#..##..#",
    ".######.",
    ".#....#.",
    "##.##.##",
    ".#....#.",
    ".######.",
    "#..##..#"
  ],[
    "...##...",
    ".######.",
    "##....##",
    "#..##..#",
    "##....##",
    ".######.",
    "...##..."
  ]],
  C: [[
    "........",
    "#......#",
    "##.##.##",
    "########",
    ".##..##.",
    "...##...",
    "...##..."
  ],[
    "#......#",
    "##....##",
    ".#.##.#.",
    "..####..",
    "..#..#..",
    "...##...",
    "...##..."
  ]],
  ship: [
    "....#....",
    "...###...",
    "..##.##..",
    ".#######.",
    "#########",
    "##.#.#.##"
  ],
  eye: [
    "....####....",
    "..##....##..",
    ".#..####..#.",
    "#..######..#",
    ".#..####..#.",
    "..##....##..",
    "....####...."
  ]
};
const COL = { A:'#f2e6c9', B:'#e3b66c', C:'#cf7c43', ship:'#ffd88a', eye:'#e85a3c', shield:'#7f6a4b' };
const PTS = { A:30, B:20, C:10 };

function makeSprite(rows, color, px, glow){
  const w = rows[0].length, h = rows.length, pad = 5, k = 4;
  const c = document.createElement('canvas');
  c.width = (w*px + pad*2)*k; c.height = (h*px + pad*2)*k;
  const g = c.getContext('2d');
  g.scale(k,k);
  g.fillStyle = color;
  g.shadowColor = color; g.shadowBlur = glow*k;
  for (let y=0;y<h;y++) for (let x=0;x<w;x++) if (rows[y][x]==='#') g.fillRect(pad+x*px, pad+y*px, px+0.02, px+0.02);
  return { c, w:w*px, h:h*px, pad };
}
const GW = 8, GH = 7;
// 2e image générée : les deux rangées du bas s'écartent, comme des pattes qui marchent
function walkFrame(rows){
  return rows.map((row, y) => {
    if (y < GH-2) return row;
    const out = Array(GW).fill('.');
    for (let x=0;x<GW;x++) if (row[x]==='#'){
      const nx = x < GW/2 ? x-1 : x+1;
      if (nx >= 0 && nx < GW) out[nx] = '#'; else out[x] = '#';
    }
    return out.join('');
  });
}
// jusqu'à 3 envahisseurs dessinés : un par rangée (30, 20 et 10 pts)
const KINDS = ['A','B','C'];
const okRows = r => Array.isArray(r) && r.length===GH && r.every(s => typeof s==='string' && s.length===GW) && r.join('').includes('#');
let custom = { A:null, B:null, C:null };
try {
  const c = JSON.parse(store.get('nuee-custom') || 'null');
  if (Array.isArray(c)) { if (okRows(c)) custom.A = c; }
  else if (c) for (const k of KINDS) if (okRows(c[k])) custom[k] = c[k];
} catch(e){}
const hasCustom = () => KINDS.some(k => custom[k]);
const SPR = { ship: makeSprite(ART.ship, COL.ship, 3, 4) };
function buildSprites(){
  for (const k of KINDS){
    const fr = custom[k] ? [custom[k], walkFrame(custom[k])] : ART[k];
    SPR[k] = fr.map(r => makeSprite(r, COL[k], 3, 3));
  }
}
buildSprites();
function drawSprite(s, x, y, sc=1){
  ctx.drawImage(s.c, x - s.pad*sc, y - s.pad*sc, (s.w + s.pad*2)*sc, (s.h + s.pad*2)*sc);
}

/* ---------- Audio (WebAudio, coupé dès qu'on ne joue plus) ---------- */
let actx = null, master = null, noiseBuf = null, suspT = null;
function initAudio(){
  if (!actx){
    try {
      const AC = window.AudioContext || window.webkitAudioContext;
      if (!AC) return;
      actx = new AC();
      master = actx.createGain(); master.gain.value = 0.16; master.connect(actx.destination);
      const len = Math.floor(actx.sampleRate*0.6);
      noiseBuf = actx.createBuffer(1, len, actx.sampleRate);
      const d = noiseBuf.getChannelData(0);
      for (let i=0;i<len;i++) d[i] = Math.random()*2-1;
    } catch(e){ actx = null; return; }
  }
  syncAudio();
}
function syncAudio(){
  if (!actx) return;
  const want = state==='play' && !document.hidden && !muted;
  clearTimeout(suspT);
  if (want){
    if (actx.state !== 'running') actx.resume().catch(()=>{});
  } else {
    suspT = setTimeout(() => {
      if (actx && actx.state === 'running' && !(state==='play' && !document.hidden && !muted)) actx.suspend().catch(()=>{});
    }, document.hidden ? 0 : 1200);
  }
}
function tone(freq, dur, type='square', slide=1, vol=0.5, delay=0){
  if (!actx || muted || actx.state !== 'running') return;
  const t = actx.currentTime + delay;
  const o = actx.createOscillator(), g = actx.createGain();
  o.type = type;
  o.frequency.setValueAtTime(freq, t);
  if (slide !== 1) o.frequency.exponentialRampToValueAtTime(Math.max(30, freq*slide), t+dur);
  g.gain.setValueAtTime(vol, t);
  g.gain.exponentialRampToValueAtTime(0.001, t+dur);
  o.connect(g); g.connect(master);
  o.start(t); o.stop(t+dur+0.03);
}
function noise(dur, vol=0.5, freq=1400){
  if (!actx || muted || actx.state !== 'running') return;
  const t = actx.currentTime;
  const s = actx.createBufferSource(); s.buffer = noiseBuf;
  const f = actx.createBiquadFilter(); f.type = 'lowpass'; f.frequency.value = freq;
  const g = actx.createGain();
  g.gain.setValueAtTime(vol, t); g.gain.exponentialRampToValueAtTime(0.001, t+dur);
  s.connect(f); f.connect(g); g.connect(master);
  s.start(t); s.stop(t+dur+0.03);
}
let marchNote = 0;
const sfx = {
  shoot(){ tone(900, 0.08, 'square', 0.45, 0.22); },
  boom(){ noise(0.16, 0.45, 1800); tone(180, 0.14, 'triangle', 0.5, 0.35); },
  march(){ tone(marchNote++ % 2 ? 98 : 110, 0.07, 'triangle', 1, 0.55); },
  die(){ noise(0.7, 0.7, 900); tone(240, 0.7, 'sawtooth', 0.2, 0.3); },
  eye(){ tone(520, 0.3, 'sine', 1.8, 0.25); },
  eyeKill(){ tone(1300, 0.35, 'square', 0.3, 0.25); noise(0.2, 0.3, 3000); },
  clear(){ [523,659,784,1047].forEach((f,i) => tone(f, 0.16, 'square', 1, 0.18, i*0.09)); },
  over(){ [392,330,262,196].forEach((f,i) => tone(f, 0.28, 'triangle', 1, 0.4, i*0.16)); }
};

/* ---------- Layout ---------- */
function resize(){
  const vw = window.innerWidth;
  const vh = window.visualViewport ? window.visualViewport.height : window.innerHeight;
  if (state === 'title' || state === 'over') H = Math.round(clamp(W*vh/vw, 560, 760));
  scale = Math.min(vw/W, vh/H);
  const dpr = Math.min(window.devicePixelRatio || 1, 3);
  cv.style.width = Math.floor(W*scale) + 'px';
  cv.style.height = Math.floor(H*scale) + 'px';
  document.getElementById('wrap').style.setProperty('--s', scale.toFixed(3));
  cv.width = Math.round(W*scale*dpr);
  cv.height = Math.round(H*scale*dpr);
  ctx.setTransform(cv.width/W, 0, 0, cv.height/H, 0, 0);
}
window.addEventListener('resize', resize);
if (window.visualViewport) visualViewport.addEventListener('resize', resize);

/* ---------- État du jeu ---------- */
const COLS = 7, ROWS = 4, DX = 38, DY = 32, AW = 24, AH = 21;
let score = 0, lives = 3, wave = 1;
let aliens = [], fx = 0, fy = 0, dir = 1, animDist = 0, frame = 0;
let pBullets = [], aBullets = [], parts = [], texts = [];
const player = { x: W/2, dead: 0, inv: 0 };
let cool = 0, fireT = 1, clearT = 0, overT = 0, shake = 0;
let quad = false, quadT = 0; // Konami code : tirs ×4
const dust = Array.from({length: 42}, () => ({ x: Math.random()*W, y: Math.random()*800, s: Math.random()*1.3+0.4, v: Math.random()*7+2 }));
const playerY = () => H - 56;

function newWave(){
  aliens = [];
  const types = ['A','B','C','C'];
  for (let r=0;r<ROWS;r++) for (let c=0;c<COLS;c++) aliens.push({ c, r, t: types[r], alive: true });
  fx = (W - ((COLS-1)*DX + AW)) / 2;
  fy = 76 + Math.min(wave-1, 6)*10;
  dir = 1; animDist = 0;
  pBullets = []; aBullets = [];
  fireT = 1.3;
}
const ax = a => fx + a.c*DX;
const ay = a => fy + a.r*DY;

function start(){
  score = 0; lives = 3; wave = 1; newRecord = false;
  resize();
  player.x = W/2; player.dead = 0; player.inv = 0;
  parts = []; texts = [];
  newWave();
  if (pointer.down) drag = { px: lastPX, sx: player.x };
  setState('play');
}
function setState(s){
  state = s;
  syncAudio();
  updateButtons();
}
function pause(){ if (state === 'play'){ keys.left = keys.right = keys.fire = false; setState('paused'); } }
function resume(){ if (state === 'paused'){ last = performance.now(); setState('play'); } }
function gameOver(){
  if (score > best){ best = score; newRecord = true; store.set('nuee-best', String(best)); }
  overT = 1.0;
  setState('over');
  sfx.over();
}

function burst(x, y, color, n, sp=90){
  for (let i=0;i<n;i++){
    const a = Math.random()*Math.PI*2, v = Math.random()*sp + sp*0.2;
    parts.push({ x, y, vx: Math.cos(a)*v, vy: Math.sin(a)*v, life: rand(0.3, 0.7), max: 0.7, color });
  }
}
function killAlien(a){
  a.alive = false;
  score += PTS[a.t];
  burst(ax(a)+AW/2, ay(a)+AH/2, COL[a.t], 14);
  sfx.boom();
}
function killPlayer(){
  burst(player.x, playerY()+9, COL.ship, 40, 140);
  burst(player.x, playerY()+9, '#ffffff', 12, 60);
  lives--;
  player.dead = 1.4;
  pBullets = []; aBullets = [];
  shake = 0.45;
  sfx.die();
}

/* ---------- Update ---------- */
function updParts(dt){
  for (const p of parts){ p.x += p.vx*dt; p.y += p.vy*dt; p.vy += 60*dt; p.vx *= 0.985; p.life -= dt; }
  parts = parts.filter(p => p.life > 0);
  for (const t of texts){ t.y -= 18*dt; t.life -= dt; }
  texts = texts.filter(t => t.life > 0);
}

function update(dt){
  updParts(dt);
  if (state === 'clear'){
    clearT -= dt;
    if (clearT <= 0){ wave++; newWave(); setState('play'); }
    return;
  }
  if (state !== 'play') return;
  const py = playerY();

  // Joueur
  if (player.dead > 0){
    player.dead -= dt;
    if (player.dead <= 0){
      if (lives <= 0){ gameOver(); return; }
      player.inv = 1.8; player.x = W/2; touchTarget = null;
      if (pointer.down) drag = { px: lastPX, sx: player.x };
    }
    return; // tout se fige pendant l'explosion
  }
  let mv = 0;
  if (keys.left) mv -= 1;
  if (keys.right) mv += 1;
  if (mv){ player.x += mv*230*dt; touchTarget = null; }
  else if (touchTarget !== null){
    const d = touchTarget - player.x, m = 520*dt;
    player.x += Math.abs(d) < m ? d : Math.sign(d)*m;
  }
  player.x = clamp(player.x, 16, W-16);
  if (player.inv > 0) player.inv -= dt;
  cool -= dt;
  if ((keys.fire || pointer.down) && cool <= 0 && pBullets.length < (quad ? 8 : 2)){
    if (quad) [-9,-3,3,9].forEach(o => pBullets.push({ x: player.x - 1 + o, y: py - 6, vx: o*9 }));
    else pBullets.push({ x: player.x - 1, y: py - 6 });
    cool = 0.3;
    sfx.shoot();
  }

  // Tirs du joueur
  for (const b of pBullets){
    b.y -= 450*dt; if (b.vx) b.x += b.vx*dt;
    if (b.y < 30){ b.dead = true; continue; }
    for (const a of aliens){
      if (!a.alive) continue;
      const x = ax(a), y = ay(a);
      if (b.x+2 > x && b.x < x+AW && b.y < y+AH && b.y+9 > y){ killAlien(a); b.dead = true; break; }
    }
    if (b.dead) continue;
    for (const ab of aBullets){
      if (!ab.dead && Math.abs(ab.x - b.x) < 5 && Math.abs(ab.y - b.y) < 9){
        ab.dead = true; b.dead = true;
        burst(b.x, b.y, '#fff3c4', 6, 50);
        break;
      }
    }
  }
  pBullets = pBullets.filter(b => !b.dead);

  // Essaim
  const alive = aliens.filter(a => a.alive);
  if (!alive.length){
    state = 'clear'; clearT = 1.9;
    pBullets = []; aBullets = [];
    sfx.clear();
    updateButtons();
    return;
  }
  let minC = 99, maxC = -1, maxR = -1;
  for (const a of alive){ minC = Math.min(minC, a.c); maxC = Math.max(maxC, a.c); maxR = Math.max(maxR, a.r); }
  const speed = 16 + wave*4 + 150*Math.pow(1 - alive.length/(COLS*ROWS), 1.8);
  fx += dir*speed*dt;
  const left = fx + minC*DX, right = fx + maxC*DX + AW;
  if (right > W-8){ fx -= right - (W-8); dir = -1; fy += 14; }
  else if (left < 8){ fx += 8 - left; dir = 1; fy += 14; }
  animDist += speed*dt;
  if (animDist >= 11){ animDist = 0; frame ^= 1; sfx.march(); }
  const bottom = fy + maxR*DY + AH;
  if (bottom >= py){
    lives = 1; killPlayer(); // l'essaim a touché le sol : fin de partie
    return;
  }

  // Tirs ennemis
  fireT -= dt;
  if (fireT <= 0){
    const maxB = 2 + Math.floor(wave/2);
    if (aBullets.length < maxB){
      const bottoms = {};
      for (const a of alive) if (!bottoms[a.c] || a.r > bottoms[a.c].r) bottoms[a.c] = a;
      const list = Object.values(bottoms);
      let a;
      if (Math.random() < 0.4){
        a = list.reduce((m, v) => Math.abs(ax(v)+AW/2 - player.x) < Math.abs(ax(m)+AW/2 - player.x) ? v : m);
      } else a = list[Math.floor(Math.random()*list.length)];
      aBullets.push({ x: ax(a) + AW/2 - 1.5, y: ay(a) + AH, v: 130 + wave*12, ph: Math.random() });
    }
    fireT = rand(0.45, 1.2) / (1 + 0.12*(wave-1));
  }
  for (const b of aBullets){
    if (b.dead) continue;
    b.y += b.v*dt; b.ph += dt;
    if (b.y > H-34){ b.dead = true; burst(b.x, H-34, COL.eye, 4, 30); continue; }
    if (player.inv <= 0 && b.x+3 > player.x-12 && b.x < player.x+12 && b.y+9 > py+3 && b.y < py+18){
      b.dead = true; killPlayer(); break;
    }
  }
  aBullets = aBullets.filter(b => !b.dead);

}

/* ---------- Rendu ---------- */
function txt(s, x, y, size, color, align='center', glow=0){
  ctx.font = size + 'px ' + FONT;
  ctx.textAlign = align;
  ctx.textBaseline = 'middle';
  ctx.fillStyle = color;
  if (glow){ ctx.shadowColor = color; ctx.shadowBlur = glow; }
  ctx.fillText(s, x, y);
  ctx.shadowBlur = 0;
}
function lightOverlay(cx, cy){
  const g = ctx.createRadialGradient(cx, cy, 16, cx, cy, H*0.95);
  g.addColorStop(0, 'rgba(0,0,0,0)');
  g.addColorStop(0.45, 'rgba(0,0,0,0.18)');
  g.addColorStop(1, 'rgba(0,0,0,0.66)');
  ctx.fillStyle = g;
  ctx.fillRect(-10, -10, W+20, H+20);
  ctx.globalCompositeOperation = 'lighter';
  const w = ctx.createRadialGradient(cx, cy, 0, cx, cy, 110);
  w.addColorStop(0, 'rgba(255,190,110,0.12)');
  w.addColorStop(1, 'rgba(255,190,110,0)');
  ctx.fillStyle = w;
  ctx.fillRect(cx-110, cy-110, 220, 220);
  ctx.globalCompositeOperation = 'source-over';
}

function render(time){
  const py = playerY();
  ctx.save();
  if (shake > 0) ctx.translate((Math.random()-0.5)*shake*12, (Math.random()-0.5)*shake*12);
  ctx.fillStyle = '#0a0908';
  ctx.fillRect(-10, -10, W+20, H+20);

  ctx.fillStyle = 'rgba(255,228,190,0.16)';
  for (const d of dust) ctx.fillRect(d.x, ((d.y % H) + H) % H, d.s, d.s);

  const inGame = state === 'play' || state === 'paused' || state === 'clear' || state === 'over';
  if (inGame){
    for (const a of aliens) if (a.alive) drawSprite(SPR[a.t][frame], ax(a), ay(a));
    const blink = player.inv > 0 && Math.floor(player.inv*10) % 2 === 0;
    if (player.dead <= 0 && !blink && state !== 'over') drawSprite(SPR.ship, player.x - 13.5, py);

    ctx.fillStyle = '#3a3128';
    ctx.fillRect(0, H-30, W, 1);
  }

  // Clair-obscur : la lumière part du vaisseau
  if (inGame && state !== 'over') lightOverlay(player.x, py + 8);
  else lightOverlay(W/2, H*0.5);

  // Les projectiles et éclats sont des sources de lumière : dessinés par-dessus l'ombre
  if (inGame){
    for (const b of pBullets){
      ctx.fillStyle = 'rgba(255,220,150,0.22)';
      ctx.fillRect(b.x-2, b.y-2, 6, 13);
      ctx.fillStyle = '#fff3c4';
      ctx.fillRect(b.x, b.y, 2, 9);
    }
    ctx.fillStyle = COL.eye;
    for (const b of aBullets){
      const o = Math.floor(b.ph*14) % 2;
      for (let i=0;i<3;i++) ctx.fillRect(b.x + ((i+o)%2 ? 1.5 : -1.5), b.y + i*3, 3, 3);
    }
  }
  for (const p of parts){
    ctx.globalAlpha = clamp(p.life/p.max, 0, 1);
    ctx.fillStyle = p.color;
    ctx.fillRect(p.x, p.y, 2, 2);
  }
  ctx.globalAlpha = 1;
  for (const t of texts){
    ctx.globalAlpha = clamp(t.life, 0, 1);
    txt(t.txt, t.x, t.y, 8, COL.eye, 'center', 6);
  }
  ctx.globalAlpha = 1;
  ctx.restore();

  // HUD
  if (inGame){
    txt('SCORE', 14, 18, 7, 'rgba(242,230,201,0.45)', 'left');
    if (quad) txt('×4', W-14, 18, 8, '#ffd88a', 'right', 6);
    if (quadT > 0){ quadT -= 1/60; txt('KONAMI ×4', W/2, H*0.5, 14, '#ffd88a', 'center', 12); }
    txt(String(score).padStart(5,'0'), 14, 32, 10, '#f2e6c9', 'left');
    txt('BEST', W/2, 18, 7, 'rgba(242,230,201,0.45)');
    txt(String(Math.max(best, score)).padStart(5,'0'), W/2, 32, 10, '#ffd88a');
    for (let i=0;i<Math.max(0, lives - (player.dead > 0 ? 0 : 1));i++) drawSprite(SPR.ship, 14 + i*20, H-20, 0.5);
    txt('WAVE ' + wave, W-14, H-15, 7, 'rgba(242,230,201,0.55)', 'right');
  }

  if (state === 'title') drawTitle(time);
  else if (state === 'edit') {}
  else if (state === 'paused'){
    ctx.fillStyle = 'rgba(5,4,4,0.6)'; ctx.fillRect(0, 0, W, H);
    txt('PAUSE', W/2, H*0.42, 20, '#ffd88a', 'center', 10);
    txt('Touche pour reprendre', W/2, H*0.42 + 36, 8, 'rgba(242,230,201,0.7)');
  } else if (state === 'clear'){
    txt('WAVE ' + (wave+1), W/2, H*0.42, 18, '#ffd88a', 'center', 12);
    txt('the swarm is back', W/2, H*0.42 + 30, 8, 'rgba(242,230,201,0.6)');
  } else if (state === 'over'){
    ctx.fillStyle = 'rgba(5,4,4,0.55)'; ctx.fillRect(0, 0, W, H);
    txt('GAME OVER', W/2, H*0.36, 16, '#e85a3c', 'center', 12);
    txt('SCORE  ' + score, W/2, H*0.36 + 42, 10, '#f2e6c9');
    if (newRecord) txt('NEW HIGH SCORE!', W/2, H*0.36 + 66, 8, '#ffd88a', 'center', 8);
    if (overT <= 0 && Math.floor(time*2) % 2 === 0) txt('TAP TO PLAY AGAIN', W/2, H*0.36 + 110, 8, '#ffd88a');
  }
}

function drawTitle(time){
  const cy = H*0.2;
  txt('NUÉE', W/2, cy, 36, '#ffd88a', 'center', 18);
  txt('mini shoot’em up', W/2, cy + 38, 8, 'rgba(242,230,201,0.6)');
  const f = Math.floor(time*2) % 2;
  let y = cy + 84;
  for (const k of KINDS){
    const s = SPR[k][f];
    drawSprite(s, W/2 - 70, y);
    txt('= ' + PTS[k] + ' PTS', W/2 - 30, y + s.h/2, 9, COL[k], 'left');
    y += 38;
  }
  if (hasCustom()){ txt('YOUR INVADERS', W/2, y + 2, 7, 'rgba(242,230,201,0.55)'); y += 14; }
  if (Math.floor(time*2) % 2 === 0) txt('TAP TO PLAY', W/2, y + 28, 10, '#ffd88a', 'center', 8);
  txt('Swipe to move · ← → Space', W/2, y + 58, 7, 'rgba(242,230,201,0.5)');
  if (best) txt('BEST  ' + best, W/2, H - 30, 8, 'rgba(255,216,138,0.7)');
}

/* ---------- Entrées ---------- */
const keys = { left: false, right: false, fire: false };
const pointer = { down: false };
let drag = null, touchTarget = null, lastPX = W/2;
const toLX = e => { const r = cv.getBoundingClientRect(); return (e.clientX - r.left) / r.width * W; };

function tap(){
  if (state === 'edit') return;
  if (state === 'title') start();
  else if (state === 'over' && overT <= 0) start();
  else if (state === 'paused') resume();
}
cv.addEventListener('pointerdown', e => {
  e.preventDefault();
  initAudio();
  try { cv.setPointerCapture(e.pointerId); } catch(_){}
  pointer.down = true;
  lastPX = toLX(e);
  drag = { px: lastPX, sx: player.x };
  touchTarget = null;
  tap();
});
cv.addEventListener('pointermove', e => {
  if (!pointer.down || !drag) return;
  lastPX = toLX(e);
  touchTarget = clamp(drag.sx + (lastPX - drag.px)*1.4, 16, W-16);
});
const release = () => { pointer.down = false; drag = null; };
cv.addEventListener('pointerup', release);
cv.addEventListener('pointercancel', release);
cv.addEventListener('lostpointercapture', release);
cv.addEventListener('contextmenu', e => e.preventDefault());

// ↑ ↑ ↓ ↓ ← → ← → B A Entrée : le Konami code quadruple les tirs
const KONAMI = ['ArrowUp','ArrowUp','ArrowDown','ArrowDown','ArrowLeft','ArrowRight','ArrowLeft','ArrowRight','b','a','Enter'];
let kIdx = 0;
let kHist = '';
function konami(k, code){
  const m = {ArrowUp:'U',ArrowDown:'D',ArrowLeft:'L',ArrowRight:'R',Enter:'E',NumpadEnter:'E',b:'B',B:'B',a:'A',A:'A'};
  kHist = (kHist + (m[k] || (code === 'KeyB' ? 'B' : (code === 'KeyQ' || code === 'KeyA') ? 'A' : '.'))).slice(-16);
  if (/UUDDLRLR(BA){1,2}E$/.test(kHist)){ kHist = ''; kIdx = 0; quad = !quad; quadT = quad ? 1.6 : 0; try { sfx.bonus ? sfx.bonus() : sfx.shoot(); } catch(_){} return true; }
  return false;
}
window.addEventListener('keydown', e => {
  const k = e.key;
  if (state === 'edit'){ if (k === 'Escape') closeEditor(); return; }
  if (!e.repeat && konami(k, e.code)) return; // Entrée qui valide le code ne relance rien d'autre
  if (['ArrowLeft','ArrowRight','ArrowUp','ArrowDown',' '].includes(k)) e.preventDefault();
  initAudio();
  if (k === 'ArrowLeft' || k === 'a' || k === 'A' || k === 'q' || k === 'Q') keys.left = true;
  if (k === 'ArrowRight' || k === 'd' || k === 'D') keys.right = true;
  if (k === ' ' || k === 'ArrowUp' || k === 'z' || k === 'Z' || k === 'w' || k === 'W'){
    keys.fire = true;
    if (!e.repeat && state !== 'play') tap();
  }
  if (k === 'Enter' && !e.repeat) tap();
  if ((k === 'p' || k === 'P' || k === 'Escape') && !e.repeat){ state === 'play' ? pause() : resume(); }
});
window.addEventListener('keyup', e => {
  const k = e.key;
  if (k === 'ArrowLeft' || k === 'a' || k === 'A' || k === 'q' || k === 'Q') keys.left = false;
  if (k === 'ArrowRight' || k === 'd' || k === 'D') keys.right = false;
  if (k === ' ' || k === 'ArrowUp' || k === 'z' || k === 'Z' || k === 'w' || k === 'W') keys.fire = false;
});

// Onglet quitté / téléphone verrouillé : pause + audio suspendu
document.addEventListener('visibilitychange', () => { if (document.hidden) pause(); syncAudio(); });
window.addEventListener('blur', () => { pause(); release(); });
window.addEventListener('pagehide', () => { pause(); if (actx) actx.suspend().catch(()=>{}); });

/* ---------- Boutons ---------- */
const ICON = {
  pause: '<svg viewBox="0 0 16 16" fill="currentColor"><rect x="3" y="2" width="3.5" height="12"/><rect x="9.5" y="2" width="3.5" height="12"/></svg>',
  play: '<svg viewBox="0 0 16 16" fill="currentColor"><path d="M4 2l10 6-10 6z"/></svg>',
  on: '<svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.6"><path d="M2 6h3l4-3v10l-4-3H2z" fill="currentColor" stroke="none"/><path d="M11 5.5a3.5 3.5 0 010 5M13 3.5a6 6 0 010 9"/></svg>',
  off: '<svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.6"><path d="M2 6h3l4-3v10l-4-3H2z" fill="currentColor" stroke="none"/><path d="M11 6l4 4M15 6l-4 4"/></svg>'
};
function updateButtons(){
  bEdit.hidden = !(state === 'title' || (state === 'over' && overT <= 0));
  bPause.hidden = !(state === 'play' || state === 'paused');
  bPause.innerHTML = state === 'paused' ? ICON.play : ICON.pause;
  bPause.setAttribute('aria-label', state === 'paused' ? 'Reprendre' : 'Pause');
  bSound.innerHTML = muted ? ICON.off : ICON.on;
  bSound.setAttribute('aria-label', muted ? 'Activer le son' : 'Couper le son');
}
bPause.addEventListener('click', e => { e.stopPropagation(); initAudio(); state === 'play' ? pause() : resume(); bPause.blur(); });
bSound.addEventListener('click', e => {
  e.stopPropagation();
  muted = !muted;
  store.set('nuee-mute', muted ? '1' : '0');
  initAudio();
  updateButtons();
  bSound.blur();
});
for (const b of [bPause, bSound, bEdit]) b.addEventListener('pointerdown', e => e.stopPropagation());

/* ---------- Mode édition : dessine ton envahisseur ---------- */
const ed = document.getElementById('ed'), grid = document.getElementById('grid');
const prev = document.getElementById('prev'), pctx = prev.getContext('2d');
const eSym = document.getElementById('eSym'), eGo = document.getElementById('eGo');
let cells = [], sym = true, paintVal = null, cur = 'A', draft = {};
const tabs = [...document.querySelectorAll('#tabs button')];
tabs.forEach(b => { b.style.color = COL[b.dataset.k]; b.addEventListener('click', () => selectKind(b.dataset.k)); });
function selectKind(k){
  if (cells.length) draft[cur] = toRows();
  cur = k;
  tabs.forEach(b => b.classList.toggle('cur', b.dataset.k === k));
  grid.style.setProperty('--c', COL[k]);
  setGrid(draft[k]);
}
for (let y=0;y<GH;y++) for (let x=0;x<GW;x++){
  const i = document.createElement('i');
  i.dataset.x = x; i.dataset.y = y;
  if (x === GW/2-1 || x === GW/2) i.classList.add('mid');
  grid.appendChild(i);
}
const cellEls = [...grid.children];
const toRows = () => Array.from({length: GH}, (_, y) => cells.slice(y*GW, y*GW+GW).map(v => v ? '#' : '.').join(''));
function setGrid(rows){ cells = []; for (let y=0;y<GH;y++) for (let x=0;x<GW;x++) cells.push(rows[y][x] === '#' ? 1 : 0); paintGrid(); }
function paintGrid(){
  cellEls.forEach((el, i) => el.classList.toggle('on', !!cells[i]));
}
function setCell(x, y, v){
  cells[y*GW+x] = v;
  if (sym) cells[y*GW+(GW-1-x)] = v;
  paintGrid();
}
function cellAt(e){
  const el = document.elementFromPoint(e.clientX, e.clientY);
  return el && el.parentNode === grid ? el : null;
}
grid.addEventListener('pointerdown', e => {
  e.preventDefault(); e.stopPropagation();
  const el = cellAt(e); if (!el) return;
  const x = +el.dataset.x, y = +el.dataset.y;
  paintVal = cells[y*GW+x] ? 0 : 1;
  setCell(x, y, paintVal);
  try { grid.setPointerCapture(e.pointerId); } catch(_){}
});
grid.addEventListener('pointermove', e => {
  if (paintVal === null) return;
  const el = cellAt(e); if (!el) return;
  const x = +el.dataset.x, y = +el.dataset.y;
  if (cells[y*GW+x] !== paintVal) setCell(x, y, paintVal);
});
const stopPaint = () => { paintVal = null; };
grid.addEventListener('pointerup', stopPaint);
grid.addEventListener('pointercancel', stopPaint);
ed.addEventListener('pointerdown', e => e.stopPropagation());

let prevT = 0;
function drawPreview(t){
  if (state !== 'edit') return;
  const rows = toRows(), fr = Math.floor(t/450) % 2 ? walkFrame(rows) : rows;
  pctx.clearRect(0, 0, prev.width, prev.height);
  pctx.fillStyle = COL[cur]; pctx.shadowColor = COL[cur]; pctx.shadowBlur = 10;
  const k = prev.width / (GW + 1);
  for (let y=0;y<GH;y++) for (let x=0;x<GW;x++) if (fr[y][x] === '#') pctx.fillRect((x+0.5)*k, (y+0.5)*k, k+0.3, k+0.3);
  requestAnimationFrame(drawPreview);
}
function openEditor(){
  keys.left = keys.right = keys.fire = false; release();
  for (const k of KINDS) draft[k] = custom[k] || ART[k][0];
  cells = [];
  selectKind('A');
  ed.hidden = false;
  setState('edit');
  requestAnimationFrame(drawPreview);
}
function closeEditor(){ ed.hidden = true; setState('title'); }
bEdit.addEventListener('click', e => { e.stopPropagation(); openEditor(); bEdit.blur(); });
eSym.addEventListener('click', () => { sym = !sym; eSym.classList.toggle('on', sym); });
document.getElementById('eClear').addEventListener('click', () => { cells = cells.map(() => 0); paintGrid(); });
document.getElementById('eReset').addEventListener('click', () => setGrid(ART[cur][0]));
document.getElementById('eBack').addEventListener('click', closeEditor);
eGo.addEventListener('click', () => {
  draft[cur] = toRows();
  for (const k of KINDS){
    const r = draft[k], n = r.join('').split('#').length - 1;
    // grille presque vide ou modèle d'origine : on garde la créature de Nuée
    custom[k] = (n < 4 || r.join('') === ART[k][0].join('')) ? null : r;
  }
  if (hasCustom()) store.set('nuee-custom', JSON.stringify(custom)); else { try { localStorage.removeItem('nuee-custom'); } catch(e){} }
  buildSprites();
  try { parent.postMessage({ nuee: 'custom', rows: custom.A || custom.B || custom.C }, '*'); } catch(e){}
  ed.hidden = true;
  initAudio();
  start();
});

/* ---------- Boucle ---------- */
let last = performance.now();
function loop(t){
  const dt = Math.min(0.033, Math.max(0, (t - last) / 1000));
  last = t;
  for (const d of dust){ d.y -= d.v*dt; if (d.y < 0) d.y += 800; }
  if (shake > 0) shake -= dt;
  if (state === 'over' && overT > 0){ overT -= dt; if (overT <= 0) updateButtons(); }
  update(dt);
  render(t / 1000);
  requestAnimationFrame(loop);
}
resize();
updateButtons();
if (document.fonts && document.fonts.load) document.fonts.load('10px "Press Start 2P"').catch(()=>{});
requestAnimationFrame(loop);
})();
</script>
