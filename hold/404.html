<html lang="en">
<head>
<meta charset="utf-8">
<title>404 · Nabil Amara</title>
<meta name="robots" content="noindex,nofollow">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<link rel="icon" type="image/png" sizes="32x32" href="./favicon-32.png">

<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

<style>
@font-face{font-family:"Mozer";src:url(./fonts/mozer-black.woff2) format("woff2");font-weight:900;font-display:block}
@font-face{font-family:"Akke DA";src:url(./fonts/akke-micro-book.woff2) format("woff2");font-weight:400;font-display:block}
:root{--ink:#202020;--blue:#564FFF;--green:#3BE9CE;--yellow:#FFF186;--ui:Inter,system-ui,-apple-system,sans-serif;--text:"Akke DA",Georgia,serif}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%;overflow:hidden;overscroll-behavior:none;color:var(--ink);-webkit-font-smoothing:antialiased}
body{background:#f3f2ee url(./img/paper-warm.webp) center top/cover fixed}
.cv{position:fixed;inset:0;cursor:grab;touch-action:none;background-image:radial-gradient(rgba(32,32,32,.16) 1px,transparent 1.3px);background-size:22px 22px}
.cv.drag{cursor:grabbing}
.world{position:absolute;left:50%;top:50%;width:0;height:0;will-change:transform}
.it{position:absolute;transform-origin:50% 50%;animation:arrive 1.1s var(--d,0s) cubic-bezier(.33,1,.68,1) both}
@keyframes arrive{from{opacity:0;scale:2.4}to{opacity:1;scale:1}}
/* 404 */
.big{left:-330px;top:-250px;width:660px;text-align:center;font:900 300px/.86 "Mozer","Arial Narrow",sans-serif;letter-spacing:-.01em}
.sub{left:-210px;top:28px;width:420px;height:84px;display:grid;place-items:center}
.sub b{font:400 34px/1 var(--text);color:var(--blue);position:relative;z-index:1}
.sub svg{position:absolute;inset:-6px -24px;width:calc(100% + 48px);height:calc(100% + 12px);overflow:visible}
.sub path{fill:none;stroke:var(--blue);stroke-width:3;stroke-linecap:round;stroke-dasharray:1;stroke-dashoffset:1;animation:draw 1s .9s cubic-bezier(.6,0,.3,1) forwards}
@keyframes draw{to{stroke-dashoffset:0}}
.lead{left:-260px;top:132px;width:520px;text-align:center;font:400 19px/1.4 var(--text);color:rgba(32,32,32,.62)}
.back{left:-118px;top:196px;width:236px;height:54px;display:flex;align-items:center;justify-content:center;gap:10px;border-radius:999px;background:var(--ink);color:#fff;text-decoration:none;font:400 18px/1 var(--text);box-shadow:0 10px 30px -10px rgba(32,32,32,.5);transition:transform .35s cubic-bezier(.3,1.6,.5,1)}
.back svg{width:18px;height:18px}
@media (hover:hover){.back:hover{transform:scale(1.05)}}
/* l'écran vide : une frame Figma sélectionnée, sans rien dedans */
.frame{left:390px;top:-300px;width:300px;height:220px;rotate:4deg}
.frame .lbl{position:absolute;left:0;top:-22px;font:500 13px/1 var(--ui);color:rgba(32,32,32,.55)}
.frame .bx{position:absolute;inset:0;background:rgba(255,255,255,.55);outline:1.5px solid var(--blue);display:grid;place-items:center;font:500 13px/1.4 var(--ui);color:rgba(32,32,32,.35);text-align:center}
.frame i{position:absolute;width:9px;height:9px;background:#fff;border:1.5px solid var(--blue)}
.frame i:nth-of-type(1){left:-5px;top:-5px}.frame i:nth-of-type(2){right:-5px;top:-5px}.frame i:nth-of-type(3){left:-5px;bottom:-5px}.frame i:nth-of-type(4){right:-5px;bottom:-5px}
.frame .dim{position:absolute;left:50%;bottom:-30px;translate:-50% 0;padding:4px 7px;border-radius:4px;background:var(--blue);color:#fff;font:500 11px/1 var(--ui);white-space:nowrap}
/* gribouillis */
.oops{left:-520px;top:-300px;width:240px;height:110px;rotate:-8deg}
.oops text{font:600 54px "Caveat",cursive;fill:var(--ink)}
.oops path{fill:none;stroke:var(--blue);stroke-width:3;stroke-linecap:round}
.arw{left:150px;top:150px;width:170px;height:110px}
.arw path{fill:none;stroke:var(--green);stroke-width:3.2;stroke-linecap:round;stroke-linejoin:round}
.note{left:-640px;top:120px;width:200px;padding:18px 18px 22px;rotate:-5deg;background:var(--yellow);box-shadow:0 12px 26px -14px rgba(32,32,32,.35);font:600 26px/1.05 "Caveat",cursive}
.dot{left:560px;top:120px;width:120px;height:120px;border-radius:50%;background:var(--blue)}
.tile{left:-700px;top:-90px;width:150px;height:90px;rotate:-12deg;background:var(--green)}
/* chrome fixe */
.mono{position:fixed;z-index:5;left:40px;top:28px;width:70px;color:var(--ink)}
.mono svg{width:100%;height:auto;display:block;fill:currentColor}
.hint{position:fixed;z-index:5;left:0;right:0;bottom:calc(28px + env(safe-area-inset-bottom));margin:0 auto;width:max-content;padding:7px 12px;border-radius:10px;background:rgba(255,255,255,.8);-webkit-backdrop-filter:blur(8px);backdrop-filter:blur(8px);box-shadow:0 0 0 1px rgba(32,32,32,.06);font:500 12px/1 var(--ui);color:var(--ink);opacity:.8}
.hint kbd{font:inherit;padding:3px 6px;margin:0 2px;border-radius:5px;background:#fff;box-shadow:0 0 0 1px rgba(32,32,32,.15)}
/* mobile : pas de canvas manipulable, tout tient à l'écran */
@media (max-width:760px){
  .cv{cursor:default}
  .world{scale:.5}
  .hint{display:none}
  .mono{left:22px;top:20px;width:56px}
  .back{scale:1.7;top:240px}
  .lead{scale:1.6;top:150px}
}
@media (prefers-reduced-motion:reduce){.it{animation:none}.sub path{animation:none;stroke-dashoffset:0}}
</style>
</head>

<script>
(()=>{
  const cv=document.getElementById("cv"),w=document.getElementById("world");
  if(matchMedia("(max-width:760px)").matches)return; /* mobile : rien ne bouge */
  let x=0,y=0,vx=0,vy=0,drag=null,raf=0;
  const set=()=>{w.style.transform=`translate(${x}px,${y}px)`;cv.style.backgroundPosition=`${x}px ${y}px`};
  const lim=()=>{x=Math.max(-900,Math.min(900,x));y=Math.max(-700,Math.min(700,y))};
  const glide=()=>{vx*=.92;vy*=.92;x+=vx;y+=vy;lim();set();raf=Math.abs(vx)+Math.abs(vy)>.2?requestAnimationFrame(glide):0};
  cv.addEventListener("pointerdown",e=>{if(e.target.closest("a"))return;cancelAnimationFrame(raf);drag={x:e.clientX,y:e.clientY};vx=vy=0;cv.classList.add("drag");cv.setPointerCapture(e.pointerId)});
  cv.addEventListener("pointermove",e=>{if(!drag)return;vx=e.clientX-drag.x;vy=e.clientY-drag.y;x+=vx;y+=vy;drag={x:e.clientX,y:e.clientY};lim();set()});
  const up=()=>{if(!drag)return;drag=null;cv.classList.remove("drag");raf=requestAnimationFrame(glide)};
  cv.addEventListener("pointerup",up);cv.addEventListener("pointercancel",up);
  addEventListener("wheel",e=>{e.preventDefault();x-=e.deltaX;y-=e.deltaY;lim();set()},{passive:false});
})();
</script>
