<html lang="en">
<head>

<title>Ship It! — prototype</title>
<style>
@font-face{font-family:Mozer;src:url(../fonts/mozer-black.woff2) format("woff2");font-weight:900}
@font-face{font-family:Mozer;src:url(../fonts/mozer-bold.woff2) format("woff2");font-weight:700}
@font-face{font-family:Akke;src:url(../fonts/akke-micro-book.woff2) format("woff2")}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html,body{height:100%;overflow:hidden;background:#ecebe7;color:#202020;font-family:Mozer,Impact,sans-serif;touch-action:none;user-select:none;-webkit-user-select:none}
canvas#c{position:fixed;inset:0;width:100%;height:100%;display:block;cursor:grab}

.hud{position:fixed;left:0;right:0;top:0;display:flex;justify-content:space-between;align-items:flex-start;padding:max(16px,env(safe-area-inset-top)) clamp(14px,2.4vw,32px) 0;pointer-events:none;z-index:3}
.logo{font:900 clamp(26px,3.4vw,44px)/.86 Mozer;text-transform:uppercase;color:#564fff;pointer-events:auto}
.right{text-align:right}
.sc{font:900 clamp(34px,4.6vw,60px)/.9 Mozer;color:#564fff;font-variant-numeric:tabular-nums}
.sub{font:700 12px/1 Mozer;letter-spacing:.1em;text-transform:uppercase;margin-top:4px;color:#202020}
.lives{display:flex;gap:6px;justify-content:flex-end;margin-top:10px}
.lives i{width:14px;height:18px;border-radius:3px;background:#564fff;transition:.3s}
.lives i.off{background:transparent;box-shadow:inset 0 0 0 2px rgba(32,32,32,.25);transform:rotate(12deg)}
.now{position:fixed;left:50%;bottom:max(18px,env(safe-area-inset-bottom));translate:-50% 0;z-index:3;pointer-events:none;text-align:center;opacity:0;transition:opacity .2s;width:92vw}
.now.on{opacity:1}
.now small{display:block;font:700 11px Mozer;letter-spacing:.14em;text-transform:uppercase;color:#564fff;margin-bottom:4px}
.now b{font:900 clamp(22px,3.4vw,40px)/1 Mozer;text-transform:uppercase}

.auto.on{display:block}
.mute{position:fixed;right:clamp(14px,2.4vw,32px);bottom:max(18px,env(safe-area-inset-bottom));z-index:4;font:700 11px Mozer;letter-spacing:.12em;text-transform:uppercase;background:none;border:0;color:#202020;opacity:.55;cursor:pointer;padding:8px}
.pop{position:fixed;z-index:3;pointer-events:none;font:900 26px Mozer;color:#564fff;translate:-50% -50%;animation:pop .9s cubic-bezier(.2,.8,.2,1) forwards;text-shadow:0 2px 0 #fff}

<script type="module">
import * as THREE from "three";
import { RoundedBoxGeometry } from "./vendor/RoundedBoxGeometry.js";
import { RoomEnvironment } from "./vendor/RoomEnvironment.js";

await Promise.all([document.fonts.load('900 40px Mozer'), document.fonts.load('700 20px Mozer')]).catch(() => {});

const BLUE = 0x564fff, DEEP = 0x1c14f2, GREEN = 0x3be9ce, YELLOW = 0xfff186, INK = 0x202020, PAPER = 0xfffdf8;
const V3 = (x, y, z) => new THREE.Vector3(x, y, z);

/* ---------- briefs (titres d'exemple) ---------- */
const BRIEFS = [
  ["Launch post", 0], ["Hiring carousel", 0], ["Webinar ad, 4 sizes", 0], ["Black Friday story", 0], ["Feature teaser reel", 0], ["Retargeting banners", 0],
  ["Webinar landing page", 1], ["Pricing section", 1], ["Feature page hero", 1], ["Waitlist page", 1], ["Changelog page", 1], ["Case study page", 1],
  ["Q4 sales deck", 2], ["Event badge", 2], ["One-pager PDF", 2], ["Investor update deck", 2], ["Booth poster", 2], ["Email signature", 2],

const MASTERS = [
  { n: "Guidelines", c: GREEN, T: 1.5 }, { n: "Copy", c: YELLOW, T: 1.5 }, { n: "Check", c: 0xf4f1ea, T: 1.15 },

/* ---------- renderer / scene ---------- */
const canvas = document.getElementById("c");

    g.font = "700 30px Mozer"; g.globalAlpha = 0.7; g.letterSpacing = "3px"; g.fillText(top.toUpperCase(), 8, 14);
    g.globalAlpha = 1; g.letterSpacing = "0px"; let fs = 78; g.font = `900 ${fs}px Mozer`;

/* ---------- fax ---------- */
const fax = new THREE.Group(); scene.add(fax);
{
  const body = box(2.6, 0.95, 1.9, enamel(0xf4f1ea), 0.16); body.position.y = 0.5; fax.add(body);
  const top = box(2.3, 0.2, 1.1, matte(0x2a2a2e), 0.08); top.position.set(0.05, 1.02, -0.25); fax.add(top);
  const hs = box(0.45, 0.28, 1.5, enamel(BLUE), 0.14); hs.position.set(-0.98, 1.1, 0); fax.add(hs);
  for (let i = 0; i < 12; i++) { const k = box(0.2, 0.1, 0.16, matte(i === 11 ? GREEN : 0xf4f1ea), 0.04); k.position.set(-0.3 + (i % 4) * 0.27, 1.15, -0.5 + ((i / 4) | 0) * 0.23); fax.add(k); }
  const scr = box(0.75, 0.06, 0.4, new THREE.MeshStandardMaterial({ color: 0x0c0c12, emissive: GREEN, emissiveIntensity: 0.25 }), 0.03); scr.position.set(0.83, 1.14, -0.3); fax.add(scr); fax.scr = scr;
  const slot = box(1.7, 0.09, 0.2, matte(0x15151a), 0.03); slot.position.set(0.2, 0.36, 0.92); fax.add(slot);
  const lip = box(1.9, 0.08, 0.7, enamel(0xf4f1ea), 0.04); lip.position.set(0.2, 0.2, 1.2); lip.rotation.x = 0.12; fax.add(lip);
  const l = label("Incoming", "Briefs", "#202020", 1.5, 0.47); l.position.set(0.2, 1.0, 0.55); l.scale.setScalar(0.8); fax.add(l);

/* ---------- masters ---------- */
const masters = MASTERS.map((M, i) => {
  const g = new THREE.Group(); scene.add(g);
  const pad = box(2.35, 0.26, 3.1, enamel(M.c), 0.13); pad.position.y = 0.13; g.add(pad);
  const l = label("Master", M.n, "#202020", 1.9, 0.59); l.position.set(0, 0.265, 1.12); g.add(l);
  const st = { i, g, T: M.T, doc: null, p: 0, busy: false, parts: {} };
  if (i === 0) { // rouleau
    const rails = [-1.02, 1.02].map((x) => { const r = box(0.1, 0.34, 2.1, matte(0x2a2a2e), 0.04); r.position.set(x, 0.42, -0.35); g.add(r); return r; });
    const roll = new THREE.Mesh(new THREE.CylinderGeometry(0.2, 0.2, 1.95, 28), enamel(BLUE)); roll.rotation.z = Math.PI / 2; roll.castShadow = true; g.add(roll); st.parts.roll = roll;
  } else if (i === 1) { // tête d'écriture
    const bar = box(2.1, 0.12, 0.14, matte(0x2a2a2e), 0.05); g.add(bar); st.parts.bar = bar;
    const head = box(0.34, 0.3, 0.34, enamel(INK), 0.08); g.add(head); st.parts.head = head;
    [-1.02, 1.02].forEach((x) => { const r = box(0.1, 0.5, 0.2, matte(0x2a2a2e), 0.04); r.position.set(x, 0.5, -1.25); g.add(r); });
  } else { // tampon
    const arm = box(0.3, 1.9, 0.3, matte(0x2a2a2e), 0.08); arm.position.set(0, 1.2, -1.3); g.add(arm);
    const beam = box(0.26, 0.24, 1.2, matte(0x2a2a2e), 0.08); beam.position.set(0, 2.05, -0.8); g.add(beam);
    const stamp = new THREE.Group(); const h = box(0.9, 0.5, 0.9, enamel(BLUE), 0.16); const rod = box(0.2, 0.8, 0.2, matte(0x2a2a2e), 0.05); rod.position.y = 0.6; stamp.add(h, rod); g.add(stamp); st.parts.stamp = stamp;
  }
  return st;
});

/* ---------- skills ---------- */
const skills = SKILLS.map((S, i) => {
  const g = new THREE.Group(); scene.add(g);
  const inner = new THREE.Group(); g.add(inner);
  const b = box(2.45, 1.15, 2.05, enamel(0x4a42ff, { emissive: DEEP, emissiveIntensity: 0.35 }), 0.2); b.position.y = 0.58; inner.add(b);
  const slot = box(1.6, 0.06, 0.26, matte(0x0c0c12), 0.03); slot.position.set(0, 1.16, -0.5); inner.add(slot);
  const l = label(S.s, S.n, "#ffffff", 2.05, 0.64); l.position.set(0, 1.165, 0.42); inner.add(l);
  const lamp = new THREE.Mesh(new THREE.SphereGeometry(0.11, 16, 12), new THREE.MeshStandardMaterial({ color: 0xffffff, emissive: GREEN, emissiveIntensity: 0.2 })); lamp.position.set(0.98, 1.2, -0.75); inner.add(lamp);
  return { i, g, inner, lamp, j: 0 };
});

/* ---------- emplacements du bac ---------- */
const slotTex = cv(128, 170, (g, w, h) => { g.strokeStyle = "rgba(86,79,255,.55)"; g.lineWidth = 4; g.setLineDash([12, 10]); rr(g, 6, 6, w - 12, h - 12, 12); g.stroke(); });
const slots = [0, 1, 2, 3].map(() => { const m = new THREE.Mesh(new THREE.PlaneGeometry(1.36, 1.8), new THREE.MeshBasicMaterial({ map: slotTex, transparent: true, depthWrite: false })); m.rotation.x = -Math.PI / 2; scene.add(m); return { m, doc: null, p: V3(0, 0, 0) }; });

/* ---------- layout ---------- */
let BX = 8.6, BZ = 4.9, portrait = false;
const camT = V3(0, 0, 0); let camD = 20; const EL = 1.02;
function layout() {
  const w = innerWidth, h = innerHeight; R.setSize(w, h, false); cam.aspect = w / h; portrait = w / h < 1;
  if (!portrait) {
    BX = 8.7; BZ = 5.0; fax.position.set(-6.5, 0, -2.2);
    [[-7.25, 0.9], [-5.75, 0.9], [-7.25, 3.0], [-5.75, 3.0]].forEach((p, i) => slots[i].p.set(p[0], 0.02, p[1]));
    masters.forEach((s, i) => s.g.position.set(-2.75 + i * 2.75, 0, 0.3));
    skills.forEach((s, i) => s.g.position.set(6.3, 0, -2.6 + i * 2.75));
    camT.set(0, 0, 0.1);
  } else {
    BX = 4.25; BZ = 7.6; fax.position.set(0, 0, -6.1);
    [-2.4, -0.8, 0.8, 2.4].forEach((x, i) => slots[i].p.set(x, 0.02, -3.5));
    masters.forEach((s, i) => s.g.position.set(-2.75 + i * 2.75, 0, 0.1));
    skills.forEach((s, i) => s.g.position.set(-2.75 + i * 2.75, 0, 4.6));
    camT.set(0, 0, -0.6);
  }
  slots.forEach((s) => s.m.position.copy(s.p).setY(0.012));
  const t = Math.tan(THREE.MathUtils.degToRad(cam.fov / 2));
  camD = Math.max(BX / (t * cam.aspect), (BZ * Math.sin(EL) + 1.2) / t) * 1.04;
  cam.updateProjectionMatrix();
  docs.forEach((d) => { if (d.state === "idle" || d.state === "proc") d.target.copy(homePos(d.home)); });
}
const par = { x: 0, y: 0, sx: 0, sy: 0 }; let shake = 0;
function camUpdate(t, dt) {
  par.sx = lerp(par.sx, par.x, 1 - Math.exp(-dt * 3)); par.sy = lerp(par.sy, par.y, 1 - Math.exp(-dt * 3));
  shake = Math.max(0, shake - dt * 2.2);
  const sx = (Math.random() - 0.5) * shake * 0.5, sy = (Math.random() - 0.5) * shake * 0.5;
  const e = EL + par.sy * 0.035 + Math.sin(t * 0.4) * 0.006, a = par.sx * 0.06 + Math.sin(t * 0.27) * 0.008;

}

/* ---------- docs ---------- */
const docs = [];
const DW = 1.2, DH = 1.6;
function drawDoc(d) {
  const g = d.ctx, w = 300, h = 400; g.clearRect(0, 0, w, h);
  g.fillStyle = "#fffdf8"; g.fillRect(0, 0, w, h);
  if (d.stage >= 1) { g.strokeStyle = "#564fff"; g.lineWidth = 8; g.strokeRect(4, 4, w - 8, h - 8); }

  if (d.rush) { g.fillStyle = "#fff186"; g.fillRect(0, 0, w, 44); g.fillStyle = "#202020"; g.font = "900 26px Mozer"; g.letterSpacing = "4px"; g.fillText("RUSH ×2", 22, 32); g.letterSpacing = "0px"; y = 62; }
  g.fillStyle = "#202020"; g.textBaseline = "top"; g.font = "900 44px Mozer";
  const words = d.title.toUpperCase().split(" "); let line = "", lines = [];
  for (const wd of words) { const t = line ? line + " " + wd : wd; if (g.measureText(t).width > w - 44 && line) { lines.push(line); line = wd; } else line = t; }
  lines.push(line); lines.slice(0, 3).forEach((l, i) => g.fillText(l, 22, y + i * 44)); y += Math.min(3, lines.length) * 44 + 14;
  g.textBaseline = "alphabetic";
  const hh = Math.min(92, h - y - 110);
  if (d.stage >= 1) { const gr = g.createLinearGradient(0, y, 0, y + hh); gr.addColorStop(0, "#5751ff"); gr.addColorStop(1, "#1c14f2"); g.fillStyle = gr; } else g.fillStyle = "#e4e0d6";
  rr(g, 22, y, w - 44, hh, 10); g.fill(); y += hh + 18;

  d.tex.needsUpdate = true;
}
const paperSide = matte(0xf1ede3);
function makeDoc(brief, rush) {
  const c = document.createElement("canvas"); c.width = 300; c.height = 400;
  const tex = new THREE.CanvasTexture(c); tex.colorSpace = THREE.SRGBColorSpace; tex.anisotropy = 8;
  const top = new THREE.MeshStandardMaterial({ map: tex, roughness: 0.75 });
  const mesh = new THREE.Mesh(new THREE.BoxGeometry(DW, 0.03, DH), [paperSide, paperSide, top, paperSide, paperSide, paperSide]);
  mesh.castShadow = true; mesh.receiveShadow = true;
